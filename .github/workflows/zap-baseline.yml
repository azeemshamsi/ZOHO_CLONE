name: OWASP ZAP baseline scan

# Passive OWASP ZAP baseline scan of the live site, monthly and on demand. Findings are written to a GitHub issue
# ("ZAP baseline scan: ordexago.com"), updated on every run, labelled "security" + "zap-scan" (see SECURITY.md).
on:
  schedule:
    - cron: "30 21 1 * *" # 03:00 IST on the 2nd of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap:
    runs-on: ubuntu-latest
    env:
      ISSUE_TITLE: "ZAP baseline scan: ordexago.com"
    steps:
      - uses: actions/checkout@v4
      # GitHub Issues must be turned on for the report issue (Settings → General → Features → Issues).
      - name: Are issues enabled?
        id: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "issues=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" >> "$GITHUB_OUTPUT"
      - name: Labels
        if: steps.repo.outputs.issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create security --color B60205 --description "Security finding or fix" --force -R "$GITHUB_REPOSITORY"
          gh label create zap-scan --color 5319E7 --description "From the OWASP ZAP baseline scan" --force -R "$GITHUB_REPOSITORY"
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://ordexago.com
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_title: ${{ env.ISSUE_TITLE }}
          allow_issue_writing: ${{ steps.repo.outputs.issues == 'true' }}
          fail_action: false
          cmd_options: "-a -j"
          artifact_name: zap_scan
      - name: Report in the run summary
        if: always()
        run: |
          if [ -f report_md.md ]; then cat report_md.md >> "$GITHUB_STEP_SUMMARY"; else echo "No ZAP report was produced." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "${{ steps.repo.outputs.issues }}" != "true" ]; then echo "> GitHub Issues are off for this repository, so no issue was written. Turn them on in Settings → General → Features → Issues." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Label the report issue
        if: always() && steps.repo.outputs.issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" -R "$GITHUB_REPOSITORY" --add-label security --add-label zap-scan; fi
