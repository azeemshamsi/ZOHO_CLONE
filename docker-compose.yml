# Local all-in-one: `docker compose up` then open http://localhost:8080
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/mgi
      JWT_SECRET: change-me
      APP_URL: http://localhost:8080
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
